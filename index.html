<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TermWatch</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            -webkit-user-select: none;
        }
        #timer {
            /* 文字数が減ったので、さらに大きくしました */
            font-size: 25vw; 
            font-weight: bold;
            text-align: center;
            margin-top: 60px;
            letter-spacing: -2px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        #controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        button {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-family: inherit;
            font-size: 20px;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.1s;
        }
        button:active {
            background: #ffffff;
            color: #000000;
        }
        #laps {
            flex-grow: 1;
            overflow-y: auto;
            border-top: 1px dashed #555;
            padding-top: 10px;
            font-size: 18px; /* ラップの文字も少し大きく */
        }
        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #222;
        }
        .lap-item:nth-child(1) { 
            color: #fff; 
            font-weight: bold; 
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        } 
        .lap-item:not(:nth-child(1)) {
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="timer">00:00</div>

    <div id="controls">
        <button id="btn-lap" onclick="lap()">LAP</button>
        <button id="btn-stop" onclick="toggle()">STOP</button>
    </div>

    <div id="laps">
        <div style="color:#555">> Ready...</div>
    </div>

    <script>
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let running = true;
        let lapCount = 1;

        window.onload = function() {
            start();
        };

        function start() {
            startTime = Date.now() - elapsedTime;
            // 秒単位の変化なので、更新頻度は少し落としてOK（省エネ）
            timerInterval = setInterval(function printTime() {
                elapsedTime = Date.now() - startTime;
                document.getElementById("timer").innerText = timeToString(elapsedTime);
            }, 100); 
            
            document.getElementById("btn-stop").innerText = "STOP";
            document.getElementById("btn-stop").setAttribute("onclick", "toggle()");
            running = true;
        }

        function toggle() {
            if (running) {
                clearInterval(timerInterval);
                document.getElementById("btn-stop").innerText = "RESUME";
                running = false;
            } else {
                start();
            }
        }

        function lap() {
            if (!running) return;
            
            const timeStr = timeToString(elapsedTime);
            const lapDiv = document.createElement("div");
            lapDiv.className = "lap-item";
            
            lapDiv.innerHTML = `<span>Lap ${pad(lapCount)}</span> <span>${timeStr}</span>`;
            
            const lapsContainer = document.getElementById("laps");
            if (lapsContainer.children[0] && lapsContainer.children[0].innerText === "> Ready...") {
                lapsContainer.innerHTML = "";
            }
            
            lapsContainer.insertBefore(lapDiv, lapsContainer.firstChild);
            lapCount++;
        }

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            // ミリ秒の計算を削除しました

            // 1時間未満なら「分:秒」 (例: 05:30)
            if (hh === 0) {
                return `${pad(mm)}:${pad(ss)}`;
            } 
            // 1時間を超えたら「時:分:秒」 (例: 01:05:30)
            else {
                return `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
            }
        }

        function pad(n) {
            return n.toString().padStart(2, "0");
        }
    </script>
</body>
</html>
